<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groq Chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#272b35; --fg:#e7e9ee; --muted:#8b93a7; --accent:#6c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,Segoe UI,sans-serif;
         display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:720px; }
  h1 { font-size:18px; margin:0 0 16px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  select, textarea, button { font:inherit; border-radius:8px; border:1px solid var(--line);
         background:var(--panel); color:var(--fg); padding:9px 11px; }
  textarea { width:100%; resize:vertical; min-height:72px; }
  button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; padding:9px 18px; }
  button:disabled { opacity:.5; cursor:default; }
  #out { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:14px; min-height:120px; margin-top:12px; }
  small, label { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Groq Chat — GenAI Lab, Week 01</h1>

  <div class="row">
    <label for="model">Model</label>
    <select id="model">
      <option>openai/gpt-oss-120b</option>
      <option>openai/gpt-oss-20b</option>
      <option>qwen/qwen3.8-27b</option>
      <option>allam-2-7b</option>
    </select>
  </div>

  <textarea id="prompt" placeholder="Ask something...">Explain what a large language model is in 3 sentences.</textarea>

  <div class="row" style="margin-top:12px; justify-content:flex-end">
    <button id="send">Send</button>
  </div>

  <div id="out"><small>Response appears here.</small></div>
  <p><small>The API key stays on the Flask backend — it is never sent to the browser.</small></p>
</main>

<script>
const $ = id => document.getElementById(id);
const out = $("out"), send = $("send");

async function ask() {
  const prompt = $("prompt").value.trim();
  if (!prompt) { out.textContent = "Type a prompt first."; return; }

  send.disabled = true;
  out.textContent = "Thinking...";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, model: $("model").value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status + " " + res.statusText);
    out.textContent = data.reply;
  } catch (e) {
    out.textContent = "Error: " + e.message;
  } finally {
    send.disabled = false;
  }
}

send.addEventListener("click", ask);
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
});
</script>
</body>
</html>
